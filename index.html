<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>استوديو الكرتون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<div class="wrap">
<header class="top">
 <div class="brand">
  <div class="logo" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M8 5l-2 4M13 5l-2 4M18 5l-2 4"/></svg></div>
  <div><h1>استوديو الكرتون</h1><p class="sub">من الفكرة إلى مشهد متحرك</p></div>
 </div>
 <div class="row"><button class="btn sm" id="bUndo" data-a="undo" disabled>↶ تراجع</button><button class="btn sm" id="bRedo" data-a="redo" disabled>↷ إعادة</button></div>
 <div class="phase">المراحل <b>١ إلى ٣: التخطيط، الصوت، المراجعة، التصدير</b></div>
</header>
<main class="grid">
 <section>
  <div class="stagebox"><canvas id="cv" width="1280" height="720" aria-label="شاشة العرض"></canvas>
   <div id="recbadge" hidden><span id="recpct">● جارٍ التسجيل</span><button class="btn sm" data-a="rec-cancel">إلغاء</button></div></div>
  <div class="transport">
   <button class="btn pri" id="bPlay" data-a="play">تشغيل الفيلم</button>
   <button class="btn" data-a="play-scene">هذا المشهد فقط</button>
   <input type="range" id="scrub" min="0" max="10" step="0.01" value="0" dir="ltr" aria-label="شريط الوقت">
   <span class="time" id="time" dir="ltr">0:00 / 0:00</span>
   <button class="btn" id="bMute" data-a="mute" aria-pressed="false">الصوت: يعمل</button>
  </div>
  <div class="strip" id="strip" aria-label="المشاهد"></div>
 </section>
 <aside class="panel">
  <div class="tabs" role="tablist" id="tabs">
   <button role="tab" data-a="tab" data-v="plan">القصة</button>
   <button role="tab" data-a="tab" data-v="chars">الشخصيات</button>
   <button role="tab" data-a="tab" data-v="prod">المشهد</button>
   <button role="tab" data-a="tab" data-v="rev">المراجعة</button>
   <button role="tab" data-a="tab" data-v="out">الإخراج</button>
  </div>
  <div class="body" id="panel"></div>
 </aside>
</main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="src/js/00-core.js"></script>
<script src="src/js/01-project.js"></script>
<script src="src/js/02-drawing.js"></script>
<script src="src/js/03-backgrounds.js"></script>
<script src="src/js/04-characters.js"></script>
<script src="src/js/05-bubbles.js"></script>
<script src="src/js/06-scene.js"></script>
<script src="src/js/07-audio.js"></script>
<script src="src/js/08-recording.js"></script>
<script src="src/js/09-offline-export.js"></script>
<script src="src/js/10-ui.js"></script>
<script src="src/js/11-cards.js"></script>
<script src="src/js/12-gallery.js"></script>
<script src="src/js/13-voice.js"></script>
<script src="src/js/14-curves.js"></script>
<script src="src/js/15-review.js"></script>
<script src="src/js/16-playback.js"></script>
<script src="src/js/17-editing.js"></script>
</body>
</html>
